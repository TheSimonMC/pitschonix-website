# Example Nginx server block for the Pitschonix static landing page.
# Adjust the root path before enabling it.
server {
    listen 80;
    listen [::]:80;
    server_name pitschonix.eu www.pitschonix.eu;

    root /var/www/pitschonix;
    index index.html;

    location / {
        try_files $uri $uri/ /404.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
