<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12091e">
  <title>Page not found — Pitschonix</title>
  <link rel="icon" type="image/png" href="assets/img/favicon-32.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:32px;background:linear-gradient(rgba(11,7,16,.72),rgba(11,7,16,.96)),url('assets/img/social-banner.webp') center/cover no-repeat}.error-card{width:min(680px,100%);padding:clamp(32px,7vw,72px);text-align:center}.error-card img{width:min(330px,82%);margin:0 auto 20px;image-rendering:pixelated}.error-code{display:block;margin-bottom:8px;color:var(--yellow);font:900 .8rem ui-monospace,monospace;letter-spacing:.14em}.error-card h1{margin-bottom:16px;font-size:clamp(2.3rem,8vw,4.6rem);letter-spacing:-.05em}.error-card p{max-width:480px;margin:0 auto 28px}.error-card .button{margin-inline:auto}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card pixel-panel">
      <img src="assets/img/pitschonix-logo-cropped.png" alt="Pitschonix">
      <span class="error-code">ERROR 404</span>
      <h1>This chunk is missing.</h1>
      <p>The page could not be found. Return to the network homepage and continue from there.</p>
      <a class="button button--primary" href="/">Return home</a>
    </section>
  </main>
</body>
</html>
